<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     width="100%" height="100%">
  <title>Mars Orbit Diagram - Editable Physics SVG</title>
  <desc>物理题图 - 火星及其卫星轨道。所有元素独立可编辑。</desc>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E24B4A"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#185FA5"/>
    </marker>
    <style>
      .editable {{ cursor: move; }}
      .editable:hover {{ opacity: 0.8; }}
      text {{ user-select: all; }}
      .orbit {{ fill: none; stroke-dasharray: 6,4; }}
      .force-arrow {{ stroke-width: 2; }}
      .label {{ font-size: 18px; font-family: Noto Sans SC, Microsoft YaHei, sans-serif; fill: #2C2C2A; font-weight: 400; }}
      .label-small {{ font-size: 16px; font-family: Noto Sans SC, Microsoft YaHei, sans-serif; fill: #888780; }}
      .body-label {{ font-size: 17px; font-family: Noto Sans SC, Microsoft YaHei, sans-serif; fill: #2C2C2A; }}
    </style>
  </defs><g id="reference-image" class="editable">
    <image href="data:image/jpeg;base64,"
           x="30.0" y="39.71"
           width="540.0096"
           height="420.58439999999996"
           opacity="0.15"/>
  </g><circle cx="384.8" cy="266.4" r="180"
          class="editable orbit" stroke="#444441" stroke-width="1.2"
          data-orbit="III"/><text x="420" y="380" class="label-small">III</text><circle cx="384.8" cy="266.4" r="130"
          class="editable orbit" stroke="#444441" stroke-width="1.2"
          data-orbit="II"/><text x="480" y="310" class="label-small">II</text><circle cx="384.8" cy="266.4" r="85"
          class="editable orbit" stroke="#444441" stroke-width="1.2"
          data-orbit="None"/>
  <g id="mars-central-body" class="editable" data-type="planet" data-label="火星">
    <circle cx="384.8" cy="266.4" r="53.7"
      fill="none" stroke="#2C2C2A" stroke-width="2"/>
    <text x="384.8" y="266.4" class="body-label" text-anchor="middle" dominant-baseline="central">火星</text>
  </g>
  <g id="point-s" class="editable" data-type="point" data-label="S">
    <circle cx="384.8" cy="91.39999999999998" r="4.5" fill="#2C2C2A"/>
    <text x="392.8" y="83.39999999999998" class="label">S</text>
  </g>
  <g id="point-q" class="editable" data-type="point" data-label="Q">
    <circle cx="449.8" cy="211.39999999999998" r="4.5" fill="#2C2C2A"/>
    <text x="457.8" y="203.39999999999998" class="label">Q</text>
  </g>
  <g id="point-p" class="editable" data-type="point" data-label="P">
    <circle cx="424.8" cy="431.4" r="4.5" fill="#2C2C2A"/>
    <text x="432.8" y="423.4" class="label">P</text>
  </g>
  <g id="trajectory-I" class="editable" data-type="trajectory" data-label="I">
    <path d="M 60 160 Q 140 340 364.8 411.4"
      fill="none" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"
      marker-end="url(#arrowhead)"/>
    <text x="100" y="290" class="label" fill="#E24B4A">I</text>
  </g>

</svg>